name: bluesky-handball-bot

on:
  schedule:
    - cron: '7,37 * * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: R einrichten
        uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - name: Pakete installieren
        run: install.packages(c("atrrr", "tidyRSS"))
        shell: Rscript {0}

      - name: Bot ausfuehren
        env:
          BSKY_USER: ${{ secrets.BSKY_USER }}
          BSKY_APP_PASSWORD: ${{ secrets.BSKY_APP_PASSWORD }}
        run: Rscript post_handball.R

      - name: Status zurueckschreiben
        run: |
          git config user.name  "handball-bot"
          git config user.email "bot@users.noreply.github.com"
          git add state/posted_ids.txt
          git diff --staged --quiet || git commit -m "Update posted state [skip ci]"
          git push
